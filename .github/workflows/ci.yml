name: Plumbline validation

# The suite was only ever run by hand, which means the README's test claim was
# a claim rather than a check. Everything here runs offline against recorded
# model responses -- no API key, no network calls to Anthropic -- so a pull
# request can never fail because a live model had an off day.
#
# There was a third job here that rebuilt the site and failed if the committed
# docs/ differed. It was removed after measurement, not on principle. Pinning
# the build id made the build reproducible on one machine -- two consecutive
# builds now produce a zero diff -- but the chunk content hashes still differ
# between a Windows build and a Linux one, because the SWC binary is per
# platform. That is a real gap and not one worth faking around, so rather than
# leave a check that can never pass, it is written down here.
#
# The genuine fix is to stop committing docs/ and have CI build and deploy it,
# which removes the staleness class outright. Until then the risk is small: docs/
# is entirely generated, so there is no hand-edited file left to drift.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the test suite
        run: python -m pytest -q

      - name: Score the golden answer key
        run: python eval/run_eval.py

  web:
    name: Console
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # web/data/projects is generated from demo/projects and git-ignored,
      # so nothing can import a project until this runs.
      - name: Sync project data
        run: npm run sync

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Render tests
        run: npm test

      - name: Award parity against the Python pipeline
        run: npm run check:parity
